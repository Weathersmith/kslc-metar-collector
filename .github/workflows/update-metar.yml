name: Update KSLC METAR Data

on:
  schedule:
    # Runs at minute 29 and minute 59 of every hour (UTC).
    # METARs are issued around minute 53-54, so the 59-minute run catches
    # the new ob shortly after it's published, and the 29-minute run catches
    # any SPECI or correction issued mid-hour.
    - cron: '29 * * * *'
    - cron: '59 * * * *'
  # Also allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update-metar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated JSON file

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch METAR data from AWC
        run: |
          curl -s \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36" \
            -H "Accept: application/json" \
            "https://aviationweather.gov/api/data/metar?ids=KSLC&hours=12&format=json" \
            -o docs/metar.json

      - name: Verify the file is valid JSON
        run: python3 -c "import json,sys; json.load(open('docs/metar.json'))" \
          && echo "JSON is valid" \
          || (echo "Invalid JSON — keeping previous file"; git checkout docs/metar.json)

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/metar.json
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "chore: update KSLC METAR data [skip ci]"
          git push
